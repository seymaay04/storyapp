steps:
  # Docker imajını kaynaktan inşa et (Etiket olarak commit ID'sini basıyoruz)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/storyapp:latest', '.']

  # Oluşan imajı Google Container Registry (GCR) deposuna güvenlice yükle
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/storyapp:latest']

  # Google Kubernetes Engine (GKE) kümesine güvenli bağlantı kur
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'container'
      - 'clusters'
      - 'get-credentials'
      - 'storyapp-cluster'
      - '--region'
      - 'europe-west3'

  # deployment.yaml içindeki imajı güncelleyip tüm k8s manifestlerini uygula
  - name: 'gcr.io/cloud-builders/kubectl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i 's|image:.*|image: gcr.io/$PROJECT_ID/storyapp:latest|g' k8s/deployment.yaml
        kubectl apply -f k8s/

    # Otomatik yeniden başlatma
  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['rollout', 'restart', 'deployment', 'storyapp-deployment']
    env:
      - 'CLOUDSDK_COMPUTE_REGION=europe-west3'
      - 'CLOUDSDK_CONTAINER_CLUSTER=storyapp-cluster'

images:
  - 'gcr.io/$PROJECT_ID/storyapp:latest'

# Loglama ayarı: Cloud Build günlüklerini doğrudan Cloud Logging'e gönderir
options:
  logging: CLOUD_LOGGING_ONLY